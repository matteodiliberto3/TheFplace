services:
  relay:
    image: python:3.12-alpine
    container_name: hustle-vixsrc-relay
    restart: unless-stopped
    working_dir: /app
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN}
      PORT: "8787"
      RESOLVE_LIMIT: "6"
      RESOLVE_CACHE_TTL: "300"
      RESOLVE_WAIT: "1"
    volumes:
      - ./relay.py:/app/relay.py:ro
    command: python /app/relay.py
    ports:
      - "8787:8787"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: hustle-vixsrc-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://relay:8787
    depends_on:
      - relay

  announcer:
    build:
      context: .
      dockerfile: Dockerfile.announce
    container_name: hustle-vixsrc-announce
    restart: unless-stopped
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN}
      TUNNEL_CONTAINER: hustle-vixsrc-tunnel
    volumes:
      - ./announce.py:/app/announce.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - tunnel
