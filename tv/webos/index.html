<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>TheHustlePlace</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #splash {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%; height: 100%;
        z-index: 2; background: #000;
        display: -webkit-box; display: flex;
        -webkit-box-align: center; align-items: center;
        -webkit-box-pack: center; justify-content: center;
      }
      #splash i {
        display: block; width: 72px; height: 72px; line-height: 72px;
        border-radius: 16px; background: #fff; color: #111;
        font-style: normal; font-size: 34px; font-weight: 700; text-align: center;
      }
      iframe {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        border: 0; background: #000; opacity: 0;
      }
      iframe.is-ready { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <i>H</i>
    </div>
    <iframe
      id="thp"
      src="about:blank"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen="allowfullscreen"
    ></iframe>
    <script>
      var frame = document.getElementById('thp');
      var splash = document.getElementById('splash');
      var shown = false;
      var DOMAINS = [
        'https://the-fplace.vercel.app',
        'https://the-hustle-place.vercel.app'
      ];

      var activeIdx = 0;
      try {
        var saved = window.localStorage.getItem('thp_domain_idx');
        if (saved !== null && saved !== undefined) {
          var parsed = parseInt(saved, 10);
          if (!isNaN(parsed) && parsed >= 0 && parsed < DOMAINS.length) {
            activeIdx = parsed;
          }
        }
      } catch (e) {}

      var fallbackTimer = null;

      function ready() {
        if (shown) return;
        shown = true;
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        try {
          window.localStorage.setItem('thp_domain_idx', String(activeIdx));
        } catch (e) {}
        if (frame) frame.className = 'is-ready';
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        try { frame.focus(); } catch (e) {}
      }

      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'thp-ready') ready();
      });

      function startFallbackTimer() {
        if (fallbackTimer) clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(function () {
          if (!shown) {
            activeIdx = (activeIdx === 0) ? 1 : 0;
            try {
              window.localStorage.setItem('thp_domain_idx', String(activeIdx));
            } catch (e) {}
            var altHost = DOMAINS[activeIdx];
            if (frame) frame.src = altHost + '/living?boot=' + new Date().getTime();
          }
        }, 6000);
      }

      // Controllo preventivo rapido del dominio all'avvio
      function probeAndBoot() {
        if (!frame) return;
        var preferredHost = DOMAINS[activeIdx] || DOMAINS[0];
        var controller = window.AbortController ? new AbortController() : null;
        var probeTimeout = null;
        if (controller) {
          probeTimeout = setTimeout(function () { controller.abort(); }, 1400);
        }

        var opts = { method: 'GET', mode: 'cors' };
        if (controller) opts.signal = controller.signal;

        var booted = false;
        function proceedWith(hostIndex) {
          if (booted) return;
          booted = true;
          if (probeTimeout) clearTimeout(probeTimeout);
          activeIdx = hostIndex;
          var host = DOMAINS[activeIdx];
          frame.src = host + '/living?boot=' + new Date().getTime();
          startFallbackTimer();
        }

        // Tenta un preflight HEAD/GET rapido sul dominio preferito
        if (window.fetch) {
          fetch(preferredHost + '/api/health', opts)
            .then(function (res) {
              if (res && res.status < 400) {
                proceedWith(activeIdx);
              } else {
                // Dominio preferito degradato/sospeso -> passa subito all'alternativo
                proceedWith((activeIdx === 0) ? 1 : 0);
              }
            })
            .catch(function () {
              // Timeout o errore di rete sul preferito -> usa alternativo preventivamente
              proceedWith((activeIdx === 0) ? 1 : 0);
            });
          
          // Safety timeout in caso di blocco fetch: non aspettare oltre 1500ms
          setTimeout(function () { proceedWith(activeIdx); }, 1500);
        } else {
          proceedWith(activeIdx);
        }
      }

      if (frame) {
        probeAndBoot();
        document.addEventListener('keydown', function () {
          try { frame.focus(); } catch (e) {}
        });
      }

      // Safeguard definitivo per nascondere comunque lo splash dopo 12 secondi
      setTimeout(ready, 12000);
    </script>
  </body>
</html>
