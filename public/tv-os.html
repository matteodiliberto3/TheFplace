<!DOCTYPE html>
<html lang="it">
<head>

  <title>TheHustlePlace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #000; color: #fff; font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; height: 100%; }
    body { overflow: hidden; }
    html, body, #root, .shell, .scroller { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .gate-side-portrait {

      left: 0; top: 0; right: 0; bottom: 0;

      transition: opacity 240ms cubic-bezier(0.645, 0.045, 0.355, 1);

      if (Number(season.season_number) === 0) continue;
      ep = season.episodes[0];
      return {

        episode: Number(ep.episode_number) || 1
      };
    }
    return null;
  }

  function nextEpisodeOf(seasons, seasonNum, episodeNum) {
    var list = usableSeasons(seasons);
    var s, season, e, ep, nextSeason, nextEp;
    seasonNum = Number(seasonNum);
    episodeNum = Number(episodeNum);
    for (s = 0; s < list.length; s++) {
      season = list[s];
      if (Number(season.season_number) !== seasonNum) continue;
      for (e = 0; e < season.episodes.length; e++) {
        ep = season.episodes[e];
        if (Number(ep.episode_number) === episodeNum + 1) {
          return { season: seasonNum, episode: Number(ep.episode_number) };
        }
      }
      nextSeason = list[s + 1];
      if (nextSeason && nextSeason.episodes && nextSeason.episodes[0]) {
        nextEp = nextSeason.episodes[0];
        return {
          season: Number(nextSeason.season_number),
          episode: Number(nextEp.episode_number) || 1
        };
      }
      return null;
    }
    return null;
  }

  function pinTailRails(rails) {
    var cinema = [];

  function weavePlatformTop10s(rails, inserts) {
    var filled = [];
    var cinema = [];
    var coming = [];
    var body = [];
    var out;
    var rest;
    var i;
    var topIdx = -1;
    var counted = 0;
    var insertIndex = 0;
    for (i = 0; i < inserts.length; i++) {
      if (inserts[i] && inserts[i].items && inserts[i].items.length) filled.push(inserts[i]);
    }
    if (!filled.length) {
      return pinTailRails(rails);
    }
    for (i = 0; i < rails.length; i++) {
      if (rails[i].id === 'cine' || rails[i].title === 'Presto al cinema') cinema.push(rails[i]);
      else if (rails[i].id === 'soon' || rails[i].title === 'In arrivo') coming.push(rails[i]);
      else if (rails[i].id !== 'ptv' && rails[i].id !== 'pmov') body.push(rails[i]);
    }
    for (i = 0; i < body.length; i++) {
      if (body[i].id === 'top' || body[i].title === 'Top 10' || body[i].title === 'Top 10 Titoli Oggi') {
        topIdx = i;
        break;
      }
    }
    if (topIdx < 0) return body.concat(filled, cinema, coming);
    out = body.slice(0, topIdx + 1);
    rest = body.slice(topIdx + 1);
    for (i = 0; i < rest.length; i++) {
      out.push(rest[i]);
      counted += 1;
      if (insertIndex < filled.length && counted === 4) {
        out.push(filled[insertIndex]);
        insertIndex += 1;
        counted = 0;
      }
    }
    while (insertIndex < filled.length) {
      out.push(filled[insertIndex]);
      insertIndex += 1;
    }
    return out.concat(cinema, coming);
  }

  function warmupUrls(urls, done) {
    var list = [];
    var seen = {};
    var i;
    var left;
    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      done();
    }
    for (i = 0; i < (urls || []).length; i++) {
      if (!urls[i] || seen[urls[i]]) continue;
      seen[urls[i]] = 1;
      list.push(urls[i]);
    }
    if (!list.length) {
      finish();
      return;
    }
    left = list.length;
    function step() {
      left -= 1;
      if (left <= 0) finish();
    }
    for (i = 0; i < list.length; i++) {
      (function (src) {
        var pic = new Image();
        pic.onload = step;
        pic.onerror = step;
        pic.src = src;
      })(list[i]);
    }
    setTimeout(finish, 8000);
  }

  function formatClock(sec) {

    function z(n) { return (n < 10 ? '0' : '') + n; }

    return m + ':' + z(s);
  }

  function normalizeCdn(text) {
    if (!text) return '';
    return text
      .replace(/https:\/\/(sc-[a-z0-9]+-\d+)\.[^/ \t\r\n'"]+/gi, 'https://$1.vix-content.net')
      .replace(/\.(html|m4s)(\?|$)/gi, '.ts$2');
  }

  function makePlaylistUrl(master, parts) {
    var text = normalizeCdn(master || '');
    var created = [];
    var id, blob, url, partText;
    if (parts) {
      for (id in parts) {
        if (!Object.prototype.hasOwnProperty.call(parts, id)) continue;
        partText = normalizeCdn(parts[id]);
        blob = new Blob([partText], { type: 'application/vnd.apple.mpegurl' });
        url = URL.createObjectURL(blob);
        created.push(url);
        text = text.split('__PART__' + id + '.m3u8').join(url);
      }
    }
    blob = new Blob([text], { type: 'application/vnd.apple.mpegurl' });
    url = URL.createObjectURL(blob);
    created.push(url);
    return { url: url, created: created };
  }

  function bestLevel(levels) {
    var best = 0;
    var i, height, bestHeight, bitrate, bestBitrate;
    for (i = 1; i < levels.length; i++) {
      height = levels[i].height || 0;
      bestHeight = levels[best].height || 0;
      bitrate = levels[i].bitrate || 0;
      bestBitrate = levels[best].bitrate || 0;
      if (height > bestHeight || (height === bestHeight && bitrate > bestBitrate)) best = i;
    }
    return best;
  }

  function attachStream(video, playlist, onFail, onLevels, resumeAt) {

    }
    video.src = playlist;
    playWhenReady(video);
  }

  function renderPlayer(type, id) {
    var season = parseInt(qs('season'), 10) || 1;
    var episode = parseInt(qs('episode'), 10) || 1;
    var resumeAt = parseInt(qs('startAt'), 10) || 0;
    var lastTrack = 0;
    var meta = playMeta();
    var hudTimer = null;
    function clearHud() {
      if (hudTimer) window.clearTimeout(hudTimer);
      hudTimer = null;
      playerHud = null;
    }
    backHandler = function () {
      clearHud();
      if (video && video._tvHls && video._tvHls.destroy) video._tvHls.destroy();
      go('/living/' + (type === 'tv' ? 'series/' : 'movie/') + id);
    };
    root.innerHTML = '';
    var video = document.createElement('video');
    video.setAttribute('autoplay', 'autoplay');
    video.setAttribute('playsinline', 'playsinline');
    video.setAttribute('webkit-playsinline', 'true');
    root.appendChild(video);
    var hud = el('div', 'hud');
    var hudLeft = el('div', 'hud-side');
    hudLeft.appendChild(focusBtn('action', 'Indietro', 'player-back', backHandler, true));
    var qualityCycle = function () {};
    var qualityBtn = focusBtn('action', 'Qualità', 'player-quality', function () { qualityCycle(); });
    qualityBtn.style.display = 'none';
    hudLeft.appendChild(qualityBtn);
    var hudRight = el('div', 'hud-side hud-side-right');
    hud.appendChild(hudLeft);
    hud.appendChild(hudRight);
    root.appendChild(hud);
    var statusWrap = el('div', 'spin-screen');
    statusWrap.id = 'play-status-wrap';
    var status = el('div', 'spinner');
    status.id = 'play-status';
    statusWrap.appendChild(status);
    root.appendChild(statusWrap);
    var cue = el('div', 'cue cue-hide');
    cue.id = 'play-cue';
    root.appendChild(cue);
    var transport = el('div', 'transport transport-hide');
    var tbar = el('div', 'tbar');
    var fill = el('i');
    fill.id = 'play-fill';
    tbar.appendChild(fill);
    transport.appendChild(tbar);
    var ttime = el('div', 'ttime', '00:00');
    ttime.id = 'play-time';
    transport.appendChild(ttime);
    root.appendChild(transport);
    collect('player-back');
    if (type === 'tv') {
      getJson('/api/tmdb/tv/' + id + '/seasons', function (seasonJson) {
        var next = nextEpisodeOf(listOf(seasonJson), season, episode);
        if (!next) return;
        hudRight.appendChild(focusBtn('action', 'Prossimo episodio', 'player-next', function () {
          clearHud();
          if (video && video._tvHls && video._tvHls.destroy) video._tvHls.destroy();
          openPlay('tv', id, next.season, next.episode);
        }));
        collect(currentFid() || 'player-back');
      });
    }

    var cueTimer = null;
    var barTimer = null;
    var zone = 'hud';
    var userHud = false;
    function syncBar() {
      var d = video.duration;
      var t = video.currentTime || 0;
      if (d && isFinite(d) && d > 0) fill.style.width = Math.min(100, (t / d) * 100) + '%';
      ttime.innerHTML = '';
      ttime.appendChild(document.createTextNode(fmtTime(t) + (d && isFinite(d) ? ' / ' + fmtTime(d) : '')));
    }
    function showCue(text) {
      cue.innerHTML = '';
      cue.appendChild(document.createTextNode(text));
      cue.className = 'cue';
      if (cueTimer) window.clearTimeout(cueTimer);
      cueTimer = window.setTimeout(function () {
        if (video && !video.paused) cue.className = 'cue cue-hide';
      }, 1200);
    }
    function showBar() {
      transport.className = 'transport';
      syncBar();
      if (barTimer) window.clearTimeout(barTimer);
      if (video && !video.paused) {
        barTimer = window.setTimeout(function () {
          if (video && !video.paused) transport.className = 'transport transport-hide';
        }, 2800);
      }
    }
    function togglePause() {
      if (!video) return;
      if (video.paused) {
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
        showCue('Play');
      } else {
        video.pause();
        showCue('Pausa');
      }
      showBar();
    }
    var seekDebounceTimer = null;
    var pendingSeekTime = null;
    function syncBarWithTime(t) {
      var d = video.duration;
      if (d && isFinite(d) && d > 0) fill.style.width = Math.min(100, (t / d) * 100) + '%';
      ttime.innerHTML = '';
      ttime.appendChild(document.createTextNode(fmtTime(t) + (d && isFinite(d) ? ' / ' + fmtTime(d) : '')));
    }
    function seekBy(delta) {
      if (!video) return;
      var d = video.duration;
      var base = pendingSeekTime !== null ? pendingSeekTime : (video.currentTime || 0);
      var next = base + delta;
      if (next < 0) next = 0;
      if (d && isFinite(d) && next > d - 0.5) next = Math.max(0, d - 0.5);
      pendingSeekTime = next;
      var diffFromCurrent = Math.round(next - (video.currentTime || 0));
      showCue((diffFromCurrent > 0 ? '+' : '') + diffFromCurrent + ' s');
      syncBarWithTime(next);
      transport.className = 'transport';
      if (barTimer) window.clearTimeout(barTimer);
      if (seekDebounceTimer) window.clearTimeout(seekDebounceTimer);
      seekDebounceTimer = window.setTimeout(function () {
        var target = pendingSeekTime;
        pendingSeekTime = null;
        seekDebounceTimer = null;
        if (target !== null) {
          try { video.currentTime = target; } catch (err) {}
          if (video._tvHls && video._tvHls.startLoad) {
            video._tvHls.startLoad(target);
          }
        }
        if (video && !video.paused) {
          barTimer = window.setTimeout(function () {
            if (video && !video.paused) transport.className = 'transport transport-hide';
          }, 2800);
        }
      }, 250);
    }
    function hudOnButtons() {
      return zone === 'hud';
    }
    function pokeHud() {
      if (hudTimer) window.clearTimeout(hudTimer);
      hudTimer = window.setTimeout(function () {
        userHud = false;
        zone = 'watch';
        hideHud();
      }, 3500);
    }
    function hideHud() {
      hud.className = 'hud hud-hide';
      if (playerHud) playerHud.hidden = true;
    }
    function showHud() {
      zone = 'hud';
      userHud = true;
      hud.className = 'hud';
      if (playerHud) playerHud.hidden = false;
      var fid = currentFid();
      if (fid !== 'player-back' && fid !== 'player-quality' && fid !== 'player-next') fid = 'player-back';
      if (qualityBtn.style.display === 'none' && fid === 'player-quality') fid = 'player-back';
      if (!document.querySelector('[data-fid="player-next"]') && fid === 'player-next') fid = 'player-back';
      collect(fid);
      pokeHud();
    }
    function enterBar() {
      userHud = false;
      zone = 'bar';
      hideHud();
      showBar();
    }
    function handlePlayerKey(c, key, isBack) {
      if (isBack) return false;
      var left = c === 37 || key === 'ArrowLeft' || key === 'Left';
      var right = c === 39 || key === 'ArrowRight' || key === 'Right';
      var skipBack = c === 412;
      var skipFwd = c === 417;
      var ok = c === 13 || c === 23 || key === 'Enter' || key === 'Select';
      var pauseKey = c === 179 || c === 10252 || key === ' ' || key === 'MediaPlayPause';
      var up = c === 38 || key === 'ArrowUp' || key === 'Up';
      var down = c === 40 || key === 'ArrowDown' || key === 'Down';
      if (c === 19 || key === 'MediaPause') { if (video && !video.paused) togglePause(); else showBar(); return true; }
      if (c === 415 || key === 'MediaPlay') { if (video && video.paused) togglePause(); else showBar(); return true; }
      if (skipBack) { seekBy(-10); return true; }
      if (skipFwd) { seekBy(10); return true; }
      if (hudOnButtons()) {
        if (up) { showHud(); return true; }
        if (down) { enterBar(); return true; }
        if (left || right) { pokeHud(); return false; }
        if (ok) { pokeHud(); return false; }
        if (pauseKey) { togglePause(); return true; }
        return false;
      }
      if (left) { zone = 'bar'; seekBy(-10); return true; }
      if (right) { zone = 'bar'; seekBy(10); return true; }
      if (up) { showHud(); return true; }
      if (down) { enterBar(); return true; }
      if (ok || pauseKey) { togglePause(); return true; }
      return false;
    }
    video.addEventListener('timeupdate', syncBar);
    video.addEventListener('seeked', syncBar);
    video.addEventListener('pause', function () {
      showCue('Pausa');
      showBar();
      sendProgress(false);
    });
    video.addEventListener('play', function () {
      if (cue.textContent === 'Pausa') cue.className = 'cue cue-hide';
      showBar();
    });
    video.addEventListener('ended', function () {
      sendProgress(true);
      if (type === 'tv' && document.querySelector('[data-fid="player-next"]')) showHud();
    });
    video.addEventListener('timeupdate', function () {
      var now = new Date().getTime();
      if (now - lastTrack < 8000) return;
      lastTrack = now;
      sendProgress(false);
    });
    function applyResume() {
      if (!window.Hls || !Hls.isSupported()) {
        if (resumeAt > 5) {
          try { video.currentTime = resumeAt; } catch (err) {}
          resumeAt = 0;
        }
      }
    }
    video.addEventListener('loadeddata', applyResume);
    function sendProgress(ended) {
      if (!video) return;
      var d = video.duration;
      var t = video.currentTime || 0;
      var progress;
      if (ended) {
        t = (d && d > 0) ? d : t;
        progress = 100;
      } else {
        if (t < 5) return;
        progress = (d && isFinite(d) && d > 0) ? Math.min(100, Math.round((t / d) * 100)) : 0;
      }
      var body = {
        id: Number(id),
        type: type === 'tv' ? 'tv' : 'movie',
        title: (meta && meta.title) || 'Titolo',
        poster_path: (meta && meta.poster_path) || null,
        backdrop_path: (meta && meta.backdrop_path) || null,
        position_seconds: Math.floor(t),
        progress: progress,
        duration: (d && isFinite(d) && d > 0) ? Math.floor(d) : undefined
      };
      if (type === 'tv') {
        body.season = season;
        body.episode = episode;
      }
      trackWatch(body);
    }
    playerHud = { hidden: false, show: showHud, touch: showHud, dispose: clearHud, handleKey: handlePlayerKey };

    var query = 'tmdbId=' + encodeURIComponent(id) + '&type=' + type;
    if (type === 'tv') query += '&season=' + season + '&episode=' + episode;

    function showFail(msg) {
      status.className = 'play-fail';
      status.innerHTML = '';
      status.appendChild(document.createTextNode(msg || 'Il film non parte.'));
      collect('player-back');
    }

    function startWith(master, parts) {
      var source;
      if (master.indexOf('#EXTM3U') === 0 || (parts && typeof parts === 'object')) {
        source = makePlaylistUrl(master, parts);
      } else {
        source = { url: master, created: [] };
      }
      var failed = false;
      function fallbackNative() {
        if (failed) return;
        failed = true;
        if (video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl')) {
          if (video._tvHls && video._tvHls.destroy) video._tvHls.destroy();
          video.src = source.url;
          playWhenReady(video);
          return;
        }
        showFail('Errore caricamento stream. Torna indietro e riprova.');
      }
      attachStream(video, source.url, fallbackNative, function (hls, levels, best, lockLevel) {
        if (!levels || !levels.length) return;
        var order = [];
        var i;
        for (i = 0; i < levels.length; i++) order.push(i);
        order.sort(function (a, b) {
          var dh = (levels[b].height || 0) - (levels[a].height || 0);
          if (dh) return dh;
          return (levels[b].bitrate || 0) - (levels[a].bitrate || 0);
        });
        var qPos = 0;
        for (i = 0; i < order.length; i++) {
          if (order[i] === best) qPos = i;
        }
        function setQualityLabel(index) {
          qualityBtn.innerHTML = '';
          qualityBtn.appendChild(document.createTextNode(levelLabel(levels[index])));
        }
        qualityBtn.style.display = 'inline-block';
        setQualityLabel(best);
        qualityCycle = function () {
          qPos = (qPos + 1) % order.length;
          lockLevel(order[qPos]);
          setQualityLabel(order[qPos]);
          if (playerHud) playerHud.show();
        };
        collect(currentFid() || 'player-back');
      }, resumeAt);
      function hideStatus() {
        if (statusWrap && statusWrap.parentNode) statusWrap.parentNode.removeChild(statusWrap);
        if (userHud) return;
        zone = 'watch';
        hideHud();
        showBar();
      }
      video.addEventListener('loadeddata', hideStatus);
      video.addEventListener('playing', hideStatus);
      video.addEventListener('error', function () {
        showFail('Il film non parte. Torna indietro e riprova.');
      });
    }

    resolvePlayback(query, function (json) {
      var master = json && json.data && json.data.master;
      var parts = json && json.data && json.data.parts;
      if (!master) {
        showFail((json && json.error) || 'Stream non disponibile');
        return;
      }
      function begin() { startWith(master, parts); }
      if (window.Hls) {
        begin();
        return;
      }
      loadScript('/hls.min.js', function (ok) {
        if (!ok) {
          loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js', function (ok2) {
            if (!ok2) {
              loadScript('https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js', function () { begin(); });
              return;
            }
            begin();
          });
          return;
        }
        begin();
      });
    });
  }

  function bootThen(done) {
    renderBoot();
    whenHousehold(function () {
      warmSharedCatalog(function () { done(); });
    });
  }

  function route() {
    seriesPage = null;
    if (playerHud && playerHud.dispose) playerHud.dispose();
    var parts = (window.location.pathname || '').split('/');
    var section = parts[2] || '';
    var third = parts[3] || '';
    var fourth = parts[4] || '';
    if (!section) {
      if (!householdReady) {
        renderBoot();
        whenHousehold(function () { route(); });
        return;
      }
      renderGate();
      return;
    }
    if (section !== 'player' && (!householdReady || !catalogShared || !catalogShared.ready)) {
      bootThen(function () { route(); });
      return;
    }
    if (section === 'home') return renderBrowse('home');
    if (section === 'movie' && third) return renderDetail('movie', third);
    if (section === 'movies') return renderBrowse('movies');
    if (section === 'series' && third) return renderDetail('tv', third);
    if (section === 'series') return renderBrowse('series');
    if (section === 'search') {
      if (!searchQ) searchQ = storeGet('tv.search');
      return renderSearch();
    }
    if (section === 'player' && third && fourth) return renderPlayer(third === 'tv' ? 'tv' : 'movie', fourth);
    renderGate();
  }

  if (window.addEventListener) {
    window.addEventListener('popstate', function () { route(); }, false);
  }
  if (window.history && window.history.replaceState) {
    window.history.replaceState({}, '', '/living');
  }
  warmSharedCatalog(function () {});
  route();
})();
  </script>
</body>
